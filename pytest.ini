[pytest]
# GBXminer Python test suite configuration
# Keep rootdir anchored at the project root regardless of invocation CWD.
testpaths = test
# Add test/ to sys.path so `from utils.xxx import ...` works in all sub-packages.
pythonpath = test
# Show short tracebacks for cleaner CI output; long for local debugging.
addopts = --tb=short -q
# Suppress asyncio deprecation noise from pytest-asyncio.
asyncio_mode = auto
