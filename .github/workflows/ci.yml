name: CI

on:
  push:
  pull_request:

concurrency:
  group: |
    ${{ github.workflow }}-${{
      (vars.ALLOW_CONCURRENCY != '' && github.sha) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.number) ||
      (github.event_name == 'push' && github.ref)
    }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CUDA_VERSION: "12.8"
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Linux x86_64 build
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-12-8
          echo "CUDA_HOME=/usr/local/cuda-12.8" >> $GITHUB_ENV
          echo "PATH=/usr/local/cuda-12.8/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure build
        run: |
          rm -f Makefile || true
          ./autogen.sh
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure CXXFLAGS="-O3 -march=native -D_REENTRANT -falign-functions=16 -falign-jumps=16 -falign-labels=16" \
            --with-cuda=$CUDA_HOME \
            --with-nvml=libnvidia-ml.so \
            --with-nvrtc

      - name: Build
        run: make -j$(nproc)

      - name: Verify binary
        run: |
          file ./gbxminer
          ./gbxminer --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-linux-x86_64
          path: ./gbxminer
          retention-days: 3

  # Linux aarch64 build (native ARM64)
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA for ARM64
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-ubuntu2404.pin
          sudo mv cuda-ubuntu2404.pin /etc/apt/preferences.d/cuda-repository-pin-600
          wget https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda-repo-ubuntu2404-12-8-local_12.8.0-570.86.10-1_arm64.deb
          sudo dpkg -i cuda-repo-ubuntu2404-12-8-local_12.8.0-570.86.10-1_arm64.deb
          sudo cp /var/cuda-repo-ubuntu2404-12-8-local/cuda-*-keyring.gpg /usr/share/keyrings/
          sudo apt-get update
          sudo apt-get -y install cuda-toolkit-12-8
          echo "CUDA_HOME=/usr/local/cuda-12.8" >> $GITHUB_ENV
          echo "PATH=/usr/local/cuda-12.8/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure build
        run: |
          rm -f Makefile || true
          ./autogen.sh
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure CXXFLAGS="-O3 -march=armv8-a" \
            --with-cuda=$CUDA_HOME \
            --with-nvml=libnvidia-ml.so \
            --with-nvrtc

      - name: Build
        run: make -j$(nproc)

      - name: Verify binary
        run: file ./gbxminer

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-linux-aarch64
          path: ./gbxminer
          retention-days: 3

  # Windows x86_64 build
  build-windows-x86_64:
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup CUDA on Windows
        run: |
          # Download and install CUDA toolkit silently
          $ErrorActionPreference = "Stop"
          $cudaInstaller = "cuda_12.8.0_571.96_windows.exe"
          $cudaUrl = "https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/$cudaInstaller"
          Write-Host "Downloading CUDA from: $cudaUrl"
          Invoke-WebRequest -Uri $cudaUrl -OutFile $cudaInstaller
          $subpackages = "nvcc_12.8,cudart_12.8,cublas_12.8,cublas_dev_12.8,cuda_cudart_12.8,cuda_nvcc_12.8,cuda_libraries_12.8,cuda_minimal_build_12.8"
          Start-Process -FilePath ".\$cudaInstaller" -ArgumentList "-s", $subpackages -Wait -NoNewWindow
          Remove-Item $cudaInstaller
          # Set CUDA environment variables using forward slashes for MSYS2 compatibility
          $cudaPath = "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8"
          echo "$cudaPath/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUDA_HOME=$cudaPath" >> $env:GITHUB_ENV
          echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          # Use Unix-style path separator (:) for MSYS2 compatibility
          echo "PATH=$cudaPath/bin:$env:PATH" >> $env:GITHUB_ENV

      - name: Setup Windows build (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # mingw-w64-x86_64-curl provides both the headers and libcurl.dll.a
          # import library natively — no cross-compilation or external download
          # required.  openssl, jansson, and zlib are likewise available in the
          # pacman repository and link cleanly against the MINGW64 toolchain.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-jansson
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            pkg-config

      - name: Configure build
        shell: msys2 {0}
        run: |
          rm -f Makefile || true
          ./autogen.sh
          # pkg-config in MSYS2 MINGW64 resolves libcurl, openssl, and jansson
          # from the pacman-installed packages.  No cache overrides are needed
          # because the configure link test runs with the native MinGW compiler
          # against native Windows libraries.
          # Convert Windows CUDA path to MSYS2 Unix-style path.
          # Uses cygpath to handle the path conversion properly, avoiding issues
          # with spaces in "Program Files" and "NVIDIA GPU Computing Toolkit"
          # that would otherwise break autotools/Make path handling.
          # -u: convert to Unix/POSIX path format (/cygdrive/c/...)
          # -m: use mixed path format (C:/...) which works better with autotools
          CUDA_PATH=$(cygpath -m "$CUDA_HOME")
          echo "CUDA path (MSYS2): $CUDA_PATH"
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
          ./configure \
            CXXFLAGS="-O3" \
            PKG_CONFIG="pkg-config --static" \
            --with-cuda="$CUDA_PATH"

      - name: Build
        shell: msys2 {0}
        run: make -j4

      - name: Verify binary
        shell: msys2 {0}
        run: file ./gbxminer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-windows-x86_64
          path: ./gbxminer.exe
          retention-days: 3

  # Lint job - runs in parallel with builds
  lint:
    runs-on: ubuntu-24.04
    env:
      PYTHON_VERSION: "3.11"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck codespell
          cd test
          pip install -r requirements.txt

      - name: Run lint tests
        run: |
          cd test/lint
          python3 all-lint.py

  # Run Python tests after Linux x86_64 binary is built
  test-linux-x86_64:
    needs: build-linux-x86_64
    if: always() && needs.build-linux-x86_64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-x86_64
      platform: linux-x86_64
      runner: ubuntu-24.04

  # Run Python tests after Linux aarch64 binary is built
  # Note: aarch64 binary is cross-compiled on x86_64, so we run tests on x86_64
  # The binary cannot be executed on x86_64, so only unit/lint tests will run
  test-linux-aarch64:
    needs: build-linux-aarch64
    if: always() && needs.build-linux-aarch64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-aarch64
      platform: linux-aarch64
      runner: ubuntu-24.04

  # Run Python tests after Windows x86_64 binary is built
  test-windows-x86_64:
    needs: build-windows-x86_64
    if: always() && needs.build-windows-x86_64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-windows-x86_64
      platform: windows-x86_64
      runner: windows-2025
