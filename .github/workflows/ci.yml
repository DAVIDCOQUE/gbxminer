name: CI

on:
  push:
  pull_request:

concurrency:
  group: |
    ${{ github.workflow }}-${{
      (vars.ALLOW_CONCURRENCY != '' && github.sha) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.number) ||
      (github.event_name == 'push' && github.ref)
    }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CUDA_VERSION: "12.8"
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            artifact_name: gbxminer-linux-x86_64
          - os: ubuntu-24.04
            arch: aarch64
            artifact_name: gbxminer-linux-aarch64
          - os: windows-2025
            arch: win64
            artifact_name: gbxminer-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA (Linux x86_64)
        # win64 now runs on a native windows-2025 runner; this step only applies
        # to the ubuntu-24.04 x86_64 build.  nvcc cannot cross-compile CUDA
        # kernels from Linux for any other target.
        if: "matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'"
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-12-8
          echo "CUDA_HOME=/usr/local/cuda-12.8" >> $GITHUB_ENV
          echo "PATH=/usr/local/cuda-12.8/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Setup Linux aarch64 cross-compile
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'aarch64'
        run: |
          sudo dpkg --add-architecture arm64

          # GitHub Actions Ubuntu 24.04 runners are x86_64.  archive.ubuntu.com
          # and security.ubuntu.com do not serve arm64 packages at all — fetching
          # them returns HTTP 404.  Fix: annotate each existing DEB822 stanza with
          # "Architectures: amd64" so apt no longer tries to fetch arm64 indexes
          # from those mirrors, then add a separate source pointing to
          # ports.ubuntu.com which is Ubuntu's canonical non-amd64 mirror.
          sudo sed -i '/^Types: deb$/a Architectures: amd64' \
              /etc/apt/sources.list.d/ubuntu.sources

          printf '%s\n' \
            'Types: deb' \
            'URIs: http://ports.ubuntu.com/ubuntu-ports' \
            'Suites: noble noble-updates noble-security noble-backports' \
            'Components: main restricted universe multiverse' \
            'Architectures: arm64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.sources > /dev/null

          sudo apt-get update
          sudo apt-get install -y \
            crossbuild-essential-arm64 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev:arm64 \
            libjansson-dev:arm64 \
            zlib1g-dev:arm64 \
            libcurl4-openssl-dev:arm64
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Setup Windows build (MSYS2)
        if: matrix.os == 'windows-2025'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # mingw-w64-x86_64-curl provides both the headers and libcurl.dll.a
          # import library natively — no cross-compilation or external download
          # required.  openssl, jansson, and zlib are likewise available in the
          # pacman repository and link cleanly against the MINGW64 toolchain.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-jansson
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            pkg-config

      - name: Configure build (Linux x86_64)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: |
          rm -f Makefile || true
          ./autogen.sh
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure CXXFLAGS="-O3 -march=native -D_REENTRANT -falign-functions=16 -falign-jumps=16 -falign-labels=16" \
            --with-cuda=$CUDA_HOME \
            --with-nvml=libnvidia-ml.so

      - name: Configure build (Linux aarch64)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'aarch64'
        run: |
          rm -f Makefile || true
          ./autogen.sh
          # Pre-set LIBCURL* to the arm64 multiarch paths so LIBCURL_CHECK_CONFIG
          # does not call the host curl-config (which returns x86_64 flags that
          # the aarch64 cross-linker rejects).  libcurl_cv_lib_curl_usable=yes
          # skips the AC_LINK_IFELSE compile test, consistent with the other
          # ac_cv_lib_* cache overrides already present for cross-compilation.
          LIBCURL_CPPFLAGS="-I/usr/include" \
          LIBCURL="-L/usr/lib/aarch64-linux-gnu -lcurl" \
          ./configure --host=aarch64-linux-gnu \
            CXXFLAGS="-O3 -march=armv8-a" \
            libcurl_cv_lib_curl_usable=yes \
            ac_cv_lib_jansson_json_loads=yes \
            ac_cv_lib_z_gzopen=yes \
            ac_cv_lib_ssl_SSL_free=yes \
            ac_cv_lib_crypto_EVP_DigestFinal_ex=yes

      - name: Configure build (Windows native)
        if: matrix.os == 'windows-2025'
        shell: msys2 {0}
        run: |
          rm -f Makefile || true
          ./autogen.sh
          # pkg-config in MSYS2 MINGW64 resolves libcurl, openssl, and jansson
          # from the pacman-installed packages.  No cache overrides are needed
          # because the configure link test runs with the native MinGW compiler
          # against native Windows libraries.
          ./configure \
            CXXFLAGS="-O3" \
            PKG_CONFIG="pkg-config --static"

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: make -j$(nproc 2>/dev/null || echo 4)

      - name: Build (Windows)
        if: matrix.os == 'windows-2025'
        shell: msys2 {0}
        run: make -j4

      - name: Verify binary (Linux only)
        if: "matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'"
        run: |
          file ./gbxminer
          ./gbxminer --version || true

      - name: Verify binary (Linux aarch64)
        if: "matrix.os == 'ubuntu-24.04' && matrix.arch == 'aarch64'"
        run: file ./gbxminer

      - name: Verify binary (Windows)
        if: matrix.os == 'windows-2025'
        shell: msys2 {0}
        run: file ./gbxminer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ./gbxminer${{ matrix.os == 'windows-2025' && '.exe' || '' }}
          retention-days: 3

  # Lint job - runs in parallel with build
  lint:
    runs-on: ubuntu-24.04
    env:
      PYTHON_VERSION: "3.11"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd test
          pip install -r requirements.txt

      - name: Run lint tests
        run: |
          cd test
          pytest lint/ -v --tb=short

  # Run Python tests after Linux x86_64 binary is built
  test-linux-x86_64:
    needs: build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-x86_64
      platform: linux-x86_64
      runner: ubuntu-24.04

  # Run Python tests after Linux aarch64 binary is built
  # Note: aarch64 binary is cross-compiled on x86_64, so we run tests on x86_64
  # The binary cannot be executed on x86_64, so only unit/lint tests will run
  test-linux-aarch64:
    needs: build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-aarch64
      platform: linux-aarch64
      runner: ubuntu-24.04

  # Run Python tests after Windows x86_64 binary is built
  test-windows-x86_64:
    needs: build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-windows-x86_64
      platform: windows-x86_64
      runner: windows-2025
