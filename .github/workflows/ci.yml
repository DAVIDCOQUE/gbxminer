name: CI

on:
  push:
  pull_request:

concurrency:
  group: |
    ${{ github.workflow }}-${{
      (vars.ALLOW_CONCURRENCY != '' && github.sha) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.number) ||
      (github.event_name == 'push' && github.ref)
    }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CUDA_VERSION: "12.8"
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            artifact_name: gbxminer-linux-x86_64
          - os: ubuntu-24.04
            arch: aarch64
            artifact_name: gbxminer-linux-aarch64
          - os: ubuntu-24.04
            arch: win64
            artifact_name: gbxminer-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA (x86_64 only)
        # nvcc does not support Linux->Windows cross-compilation; win64 gets
        # no CUDA setup.  The win64 target builds the CPU/host-side code only.
        if: "matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'"
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-12-8
          echo "CUDA_HOME=/usr/local/cuda-12.8" >> $GITHUB_ENV
          echo "PATH=/usr/local/cuda-12.8/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Setup Linux aarch64 cross-compile
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'aarch64'
        run: |
          # Enable arm64 multiarch so apt can install arm64 dev packages
          # alongside the host x86_64 packages without conflict.
          # This MUST happen before apt-get update so the arm64 package
          # index is fetched in the same pass.
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            crossbuild-essential-arm64 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev:arm64 \
            libjansson-dev:arm64 \
            zlib1g-dev:arm64 \
            libcurl4-openssl-dev:arm64
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "CUDA_HOME=/usr/local/cuda-12.8" >> $GITHUB_ENV

      - name: Setup Windows cross-compile
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'win64'
        run: |
          sudo apt-get install -y \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64
          echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CXX=x86_64-w64-mingw32-g++" >> $GITHUB_ENV

          # Download the official pre-built mingw64 curl from curl.se.
          # This provides lib/libcurl.dll.a (mingw import library) and
          # include/curl/curl.h, which the cross-linker requires.
          # Pin the version so CI is reproducible; bump deliberately.
          CURL_WIN_VER="8.5.0"
          wget -q "https://curl.se/windows/dl-${CURL_WIN_VER}/curl-${CURL_WIN_VER}-win64-mingw.zip"
          unzip -q "curl-${CURL_WIN_VER}-win64-mingw.zip"
          CURL_WIN_DIR="$(pwd)/curl-${CURL_WIN_VER}-win64-mingw"
          echo "CURL_WIN_DIR=${CURL_WIN_DIR}" >> $GITHUB_ENV

      - name: Configure build (Linux x86_64)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: |
          rm -f Makefile || true
          ./autogen.sh
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure CXXFLAGS="-O3 -march=native -D_REENTRANT -falign-functions=16 -falign-jumps=16 -falign-labels=16" \
            --with-cuda=$CUDA_HOME \
            --with-nvml=libnvidia-ml.so

      - name: Configure build (Linux aarch64)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'aarch64'
        run: |
          rm -f Makefile || true
          ./autogen.sh
          # The host curl-config (/usr/bin/curl-config) reports x86_64 link
          # flags.  When LIBCURL_CHECK_CONFIG feeds those into AC_LINK_IFELSE
          # using the aarch64 cross-compiler the link test fails and configure
          # aborts.  Fix: pre-set LIBCURL_CPPFLAGS and LIBCURL to point at the
          # arm64 multiarch libraries, and assert libcurl_cv_lib_curl_usable=yes
          # so autoconf skips the cross-execution link test.  The arm64
          # libcurl.so is confirmed present because we installed
          # libcurl4-openssl-dev:arm64 above.
          LIBCURL_CPPFLAGS="-I/usr/include" \
          LIBCURL="-L/usr/lib/aarch64-linux-gnu -lcurl" \
          ./configure --host=aarch64-linux-gnu \
            CXXFLAGS="-O3 -march=armv8-a" \
            libcurl_cv_lib_curl_usable=yes \
            ac_cv_lib_jansson_json_loads=yes \
            ac_cv_lib_z_gzopen=yes \
            ac_cv_lib_ssl_SSL_free=yes \
            ac_cv_lib_crypto_EVP_DigestFinal_ex=yes

      - name: Configure build (Windows win64)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'win64'
        run: |
          rm -f Makefile || true
          ./autogen.sh
          # Same root cause as aarch64: the host curl-config gives x86_64
          # flags which the mingw cross-linker rejects.  Pre-set LIBCURL* to
          # the mingw curl downloaded in the setup step above.
          # -lws2_32 -lwldap32 -lcrypt32 are Windows socket/LDAP/crypto libs
          # that libcurl.dll depends on; mingw must see them at link time.
          LIBCURL_CPPFLAGS="-I${CURL_WIN_DIR}/include" \
          LIBCURL="-L${CURL_WIN_DIR}/lib -lcurl -lws2_32 -lwldap32 -lcrypt32" \
          ./configure --host=x86_64-w64-mingw32 \
            CXXFLAGS="-O3" \
            libcurl_cv_lib_curl_usable=yes \
            ac_cv_lib_jansson_json_loads=yes \
            ac_cv_lib_z_gzopen=yes \
            ac_cv_lib_ssl_SSL_free=yes \
            ac_cv_lib_crypto_EVP_DigestFinal_ex=yes

      - name: Build
        run: make -j$(nproc)

      - name: Verify binary (Linux only)
        if: "matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'"
        run: |
          file ./gbxminer
          ./gbxminer --version || true

      - name: Verify binary (Linux aarch64)
        if: "matrix.os == 'ubuntu-24.04' && matrix.arch == 'aarch64'"
        run: |
          file ./gbxminer

      - name: Verify binary (Windows win64)
        if: "matrix.os == 'ubuntu-24.04' && matrix.arch == 'win64'"
        run: |
          file ./gbxminer

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ./gbxminer
          retention-days: 3
