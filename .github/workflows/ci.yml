name: CI

on:
  push:
  pull_request:

concurrency:
  group: |
    ${{ github.workflow }}-${{
      (vars.ALLOW_CONCURRENCY != '' && github.sha) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.number) ||
      (github.event_name == 'push' && github.ref)
    }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CUDA_VERSION: "12.8"
  CUDA_PKG_VERSION: "12-8"
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA (x86_64 network repo)
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          # FIX #4: Use CUDA_PKG_VERSION so the global env var actually drives this.
          sudo apt-get install -y "cuda-toolkit-${{ env.CUDA_PKG_VERSION }}"
          echo "CUDA_HOME=/usr/local/cuda-${{ env.CUDA_VERSION }}" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure build
        run: |
          # FIX #6: rm -f already suppresses ENOENT; the || true guard was redundant.
          rm -f Makefile
          ./autogen.sh
          # FIX #2: -march=native produces a binary tied to the CI runner's CPU
          # microarchitecture, causing SIGILL on machines lacking those extensions.
          # Omitting -march lets the compiler target the safe x86-64 baseline,
          # producing a distributable artifact that runs on all x86_64 hardware.
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure \
              CXXFLAGS="-O3 -D_REENTRANT -falign-functions=16 -falign-jumps=16 -falign-labels=16" \
              --with-cuda="$CUDA_HOME" \
              --with-nvml=libnvidia-ml.so \
              --with-nvrtc

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify binary
        run: |
          file ./gbxminer
          ./gbxminer --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-linux-x86_64
          path: ./gbxminer
          retention-days: 3

  # ── Linux aarch64 (native ARM64 runner) ───────────────────────────────────
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA (aarch64/SBSA network repo)
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          # FIX #4: Use CUDA_PKG_VERSION so the global env var actually drives this.
          sudo apt-get install -y "cuda-toolkit-${{ env.CUDA_PKG_VERSION }}"
          echo "CUDA_HOME=/usr/local/cuda-${{ env.CUDA_VERSION }}" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure build
        run: |
          # FIX #6: rm -f already suppresses ENOENT; the || true guard was redundant.
          rm -f Makefile
          ./autogen.sh
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure \
              CXXFLAGS="-O3 -march=armv8-a" \
              --with-cuda="$CUDA_HOME" \
              --with-nvml=libnvidia-ml.so \
              --with-nvrtc

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify binary
        run: |
          file ./gbxminer
          ./gbxminer --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-linux-aarch64
          path: ./gbxminer
          retention-days: 3

  # ── Windows x86_64 ────────────────────────────────────────────────────────
  build-windows-x86_64:
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup CUDA on Windows
        run: |
          $ErrorActionPreference = "Stop"
          # FIX #4: Derive installer filename and URL from the global CUDA_VERSION
          # env var so a single-line bump keeps Windows in sync with Linux.
          $cudaVersion = "${{ env.CUDA_VERSION }}"
          $cudaInstaller = "cuda_${cudaVersion}.0_571.96_windows.exe"
          $cudaUrl = "https://developer.download.nvidia.com/compute/cuda/${cudaVersion}.0/local_installers/$cudaInstaller"
          Write-Host "Downloading CUDA from: $cudaUrl"
          Invoke-WebRequest -Uri $cudaUrl -OutFile $cudaInstaller

          # FIX #5: The CUDA Windows installer's silent-install (-s) syntax expects
          # components as individual space-separated arguments, not a single
          # comma-delimited string.  Passing a comma-string via Start-Process
          # -ArgumentList delivers it as one malformed token; the installer may
          # then install nothing or default to a full installation.
          # Use a PowerShell array so each component is a distinct argument.
          $components = @(
              "nvcc_${{ env.CUDA_VERSION }}",
              "cudart_${{ env.CUDA_VERSION }}",
              "cublas_${{ env.CUDA_VERSION }}",
              "cublas_dev_${{ env.CUDA_VERSION }}",
              "cuda_cudart_${{ env.CUDA_VERSION }}",
              "cuda_nvcc_${{ env.CUDA_VERSION }}",
              "cuda_libraries_${{ env.CUDA_VERSION }}",
              "cuda_minimal_build_${{ env.CUDA_VERSION }}"
          )
          $installerArgs = @("-s") + $components
          Start-Process -FilePath ".\$cudaInstaller" -ArgumentList $installerArgs -Wait -NoNewWindow
          Remove-Item $cudaInstaller

          # Use forward-slash paths for MSYS2/autotools compatibility.
          $cudaPath = "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v$cudaVersion"
          "$cudaPath/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_HOME=$cudaPath"  | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append
          "CUDA_PATH=$cudaPath"  | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append

      - name: Setup Windows build (MSYS2/MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # mingw-w64-x86_64-curl provides both the headers and libcurl.dll.a
          # import library natively — no cross-compilation or external download
          # required.  openssl, jansson, and zlib are likewise available in the
          # pacman repository and link cleanly against the MINGW64 toolchain.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-jansson
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            pkg-config

      - name: Configure build
        shell: msys2 {0}
        run: |
          # FIX #6: rm -f already suppresses ENOENT; the || true guard was redundant.
          rm -f Makefile
          ./autogen.sh
          # cygpath -m converts "C:\Program Files\..." to "C:/Program Files/..."
          # (mixed format), which autotools handles correctly without choking on
          # backslashes or spaces in "NVIDIA GPU Computing Toolkit".
          CUDA_PATH_MSYS=$(cygpath -m "$CUDA_HOME")
          echo "CUDA path (MSYS2 mixed): $CUDA_PATH_MSYS"
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
          ./configure \
            CXXFLAGS="-O3" \
            PKG_CONFIG="pkg-config --static" \
            --with-cuda="$CUDA_PATH_MSYS"

      - name: Build
        shell: msys2 {0}
        run: make -j4

      - name: Verify binary
        shell: msys2 {0}
        run: file ./gbxminer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-windows-x86_64
          path: ./gbxminer.exe
          retention-days: 3

  # ── Lint (runs in parallel with builds) ───────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    env:
      PYTHON_VERSION: "3.11"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck codespell
          cd test
          pip install -r requirements.txt

      - name: Run lint tests
        run: |
          cd test/lint
          python3 all-lint.py

  # ── Test jobs (downstream of build jobs) ──────────────────────────────────

  test-linux-x86_64:
    needs: build-linux-x86_64
    if: always() && needs.build-linux-x86_64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-x86_64
      platform: linux-x86_64
      runner: ubuntu-24.04

  test-linux-aarch64:
    needs: build-linux-aarch64
    if: always() && needs.build-linux-aarch64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-aarch64
      platform: linux-aarch64
      runner: ubuntu-24.04-arm

  test-windows-x86_64:
    needs: build-windows-x86_64
    if: always() && needs.build-windows-x86_64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-windows-x86_64
      platform: windows-x86_64
      runner: windows-2025
