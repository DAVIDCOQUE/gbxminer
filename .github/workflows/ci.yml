name: CI

on:
  push:
  pull_request:

concurrency:
  group: |
    ${{ github.workflow }}-${{
      (vars.ALLOW_CONCURRENCY != '' && github.sha) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.number) ||
      (github.event_name == 'push' && github.ref)
    }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CUDA_VERSION: "12.8"
  CUDA_PKG_VERSION: "12-8"
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA (x86_64 network repo)
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y "cuda-toolkit-${{ env.CUDA_PKG_VERSION }}"
          echo "CUDA_HOME=/usr/local/cuda-${{ env.CUDA_VERSION }}" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure build
        run: |
          # FIX #6: rm -f already suppresses ENOENT; the || true guard was redundant.
          rm -f Makefile
          ./autogen.sh
          # LDFLAGS stubs path: libcuda.so is the NVIDIA *driver* library, absent
          # on GPU-less CI runners.  The CUDA toolkit ships a linker stub at
          # lib64/stubs/libcuda.so that satisfies -lcuda at build time.  The real
          # driver library is resolved at runtime via the user's LD_LIBRARY_PATH.
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure \
              CXXFLAGS="-O3 -D_REENTRANT -falign-functions=16 -falign-jumps=16 -falign-labels=16" \
              LDFLAGS="-L${CUDA_HOME}/lib64/stubs" \
              --with-cuda="$CUDA_HOME" \
              --with-nvml=libnvidia-ml.so \
              --with-nvrtc

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify binary
        run: |
          file ./gbxminer
          ./gbxminer --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-linux-x86_64
          path: ./gbxminer
          retention-days: 3

  # ── Linux aarch64 (native ARM64 runner) ───────────────────────────────────
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA (aarch64/SBSA network repo)
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y "cuda-toolkit-${{ env.CUDA_PKG_VERSION }}"
          echo "CUDA_HOME=/usr/local/cuda-${{ env.CUDA_VERSION }}" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure build
        run: |
          # FIX #6: rm -f already suppresses ENOENT; the || true guard was redundant.
          rm -f Makefile
          ./autogen.sh
          # Same stubs rationale as x86_64: libcuda.so is a driver library,
          # absent on GPU-less CI runners.  Point the linker at the toolkit stub.
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure \
              CXXFLAGS="-O3 -march=armv8-a" \
              LDFLAGS="-L${CUDA_HOME}/lib64/stubs" \
              --with-cuda="$CUDA_HOME" \
              --with-nvml=libnvidia-ml.so \
              --with-nvrtc

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify binary
        run: |
          file ./gbxminer
          ./gbxminer --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-linux-aarch64
          path: ./gbxminer
          retention-days: 3

  # ── Windows x86_64 ────────────────────────────────────────────────────────
  build-windows-x86_64:
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup CUDA on Windows
        run: |
          $ErrorActionPreference = "Stop"
          $cudaVersion = "${{ env.CUDA_VERSION }}"
          $cudaInstaller = "cuda_${cudaVersion}.0_571.96_windows.exe"
          $cudaUrl = "https://developer.download.nvidia.com/compute/cuda/${cudaVersion}.0/local_installers/$cudaInstaller"
          Write-Host "Downloading CUDA from: $cudaUrl"
          Invoke-WebRequest -Uri $cudaUrl -OutFile $cudaInstaller

          # Run a full silent install (-s with no component list).
          # Component-filtered installs silently no-op when any component
          # name is unrecognised; the installer exits 0 and installs nothing.
          # A full silent install is unambiguous and idiomatic for CI.
          Write-Host "Installing CUDA $cudaVersion (silent, full)..."
          Start-Process -FilePath ".\$cudaInstaller" -ArgumentList @("-s") -Wait -NoNewWindow
          Remove-Item $cudaInstaller

          # Verify the install actually produced the expected tree before
          # proceeding.  The CUDA installer exits 0 even on partial failure,
          # so an explicit path check is the only reliable gate.
          $cudaReal = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$cudaVersion"
          if (-not (Test-Path $cudaReal)) {
              Write-Error "CUDA install did not produce expected directory: $cudaReal"
              exit 1
          }
          Write-Host "CUDA installed at: $cudaReal"

          # Create an NTFS directory junction at C:\cuda.
          # The default install path contains spaces ("Program Files",
          # "NVIDIA GPU Computing Toolkit") that autotools writes unquoted
          # into Makefile CFLAGS, causing GCC to word-split the path and
          # treat each token as a linker input.  A junction at C:\cuda is
          # space-free and kernel-transparent to both nvcc and MinGW GCC.
          $cudaJunction = "C:\cuda"
          New-Item -ItemType Junction -Path $cudaJunction -Target $cudaReal | Out-Null
          Write-Host "Junction created: $cudaJunction -> $cudaReal"

          "$cudaJunction/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_HOME=$cudaJunction" | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append
          "CUDA_PATH=$cudaJunction" | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append

      - name: Add MSVC cl.exe to PATH for nvcc toolchain probe
        run: |
          # nvcc on Windows runs an unconditional cl.exe PATH probe at startup
          # (Check 1).  This probe is independent of -ccbin — it runs before
          # any flag is applied and fails fatally when cl.exe is absent.
          # The windows-2025 runner ships VS 2022 but does not add cl.exe to
          # the default PATH; locate it via vswhere and export it.
          #
          # Note: cl.exe being findable triggers two further nvcc behaviours
          # that also require suppression (see subsequent steps):
          #   Check 2 — MSVC version gate: suppressed by -allow-unsupported-compiler
          #   Check 3 — MSVC flag injection: suppressed by the g++ filter shim
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
              Write-Error "vswhere.exe not found; cannot locate MSVC cl.exe"
              exit 1
          }
          $msvcDir = & $vswhere -latest -products * `
              -requires Microsoft.VisualCpp.Tools.HostX64.TargetX64 `
              -find "VC\Tools\MSVC\*\bin\HostX64\x64" 2>$null |
              Select-Object -First 1
          if (-not $msvcDir) {
              Write-Error "Could not locate MSVC HostX64 cl.exe via vswhere"
              exit 1
          }
          Write-Host "Adding MSVC to PATH: $msvcDir"
          $msvcDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Windows build (MSYS2/MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # path-type: inherit causes MSYS2 to convert and prepend the full
          # Windows PATH (including GITHUB_PATH additions from prior steps)
          # into the MSYS2 shell PATH.  Required so that nvcc.exe (a native
          # Windows binary invoked by make) inherits a PATH that includes the
          # MSVC directory added by the "Add MSVC cl.exe" step above.
          # Without this, msys2/setup-msys2 defaults to path-type: minimal
          # and strips all GITHUB_PATH additions.
          path-type: inherit
          # mingw-w64-x86_64-curl provides both the headers and libcurl.dll.a
          # import library natively — no cross-compilation or external download
          # required.  openssl, jansson, and zlib are likewise available in the
          # pacman repository and link cleanly against the MINGW64 toolchain.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-jansson
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            pkg-config

      - name: Create nvcc g++ host-compiler filter shim
        run: |
          # Check 3 — MSVC flag injection: once cl.exe is on PATH, nvcc 12.x
          # unconditionally sets its internal host-compiler suite to MSVC and
          # prepends MSVC-only flags (-nologo, -EHsc) to every host-compiler
          # invocation, regardless of -ccbin or CUDAHOSTCXX (proven across four
          # CI runs to be non-functional for this suppression).  g++ does not
          # recognise these flags and fails fatally.
          #
          # Solution: a filter shim at C:\nvcc-shim\g++.bat strips the injected
          # flags before forwarding argv to the real MinGW g++.exe.  Pointing
          # -ccbin at the full shim path avoids any PATH ordering dependency.
          #
          # This step must run AFTER msys2/setup-msys2 so that the real g++.exe
          # already exists at C:\msys64\mingw64\bin\g++.exe.
          #
          # NOTE: PowerShell here-string syntax requires the closing marker at
          # column 0, which breaks YAML block scalar indentation.  The script is
          # therefore written line-by-line via Set-Content / Add-Content.
          New-Item -ItemType Directory -Force -Path C:\nvcc-shim | Out-Null

          # Write gpp_filter.py using shutil.which to discover g++ at
          # runtime rather than hardcoding C:\msys64\mingw64\bin\g++.exe.
          # The MSYS2 installation path is not guaranteed across runner images.
          $f = 'C:\nvcc-shim\gpp_filter.py'
          'import sys, subprocess, shutil'                               | Set-Content $f -Encoding utf8
          "MSVC_ONLY = frozenset(['-nologo', '-EHsc', '-FS'])"          | Add-Content $f -Encoding utf8
          'args = [a for a in sys.argv[1:] if a not in MSVC_ONLY]'     | Add-Content $f -Encoding utf8
          "gpp = shutil.which('g++')"                                   | Add-Content $f -Encoding utf8
          'if not gpp: sys.stderr.write("gpp_filter: g++ not in PATH\n"); sys.exit(127)' | Add-Content $f -Encoding utf8
          'sys.exit(subprocess.run([gpp] + args).returncode)'           | Add-Content $f -Encoding utf8

          $b = 'C:\nvcc-shim\g++.bat'
          '@echo off'                                     | Set-Content $b -Encoding ascii
          'python C:\nvcc-shim\gpp_filter.py %*'       | Add-Content $b -Encoding ascii

          Write-Host "Shim installed:"
          Get-Content C:\nvcc-shim\g++.bat
          Get-Content C:\nvcc-shim\gpp_filter.py

      - name: Configure build
        shell: msys2 {0}
        run: |
          rm -f Makefile
          ./autogen.sh
          # CUDA_HOME is set to the junction C:\cuda (no spaces) by the
          # "Setup CUDA on Windows" step above.  cygpath -m of a path that
          # already contains no spaces is a no-op, so we pass it directly.
          # Forward-slash form (C:/cuda) is accepted by both autotools and nvcc.
          CUDA_PATH_MSYS=$(cygpath -m "$CUDA_HOME")
          echo "CUDA path: $CUDA_PATH_MSYS"
          # -ccbin C:/nvcc-shim/g++.bat: full path to the filter shim (Check 3).
          #   nvcc resolves -ccbin as a direct path when it contains a slash —
          #   no PATH search occurs.  The .bat extension is cmd.exe-executable.
          # -allow-unsupported-compiler: suppresses the MSVC version gate
          #   (Check 2).  windows-2025 ships VS 2022 17.13+, outside nvcc
          #   12.8's validated range [2019, 2022].
          CUDA_CFLAGS="-O3 -lineno -ccbin C:/nvcc-shim/g++.bat -allow-unsupported-compiler -Xcompiler -Wall -D_FORCE_INLINES" \
          ./configure \
            CXXFLAGS="-O3 -Wno-builtin-macro-redefined" \
            PKG_CONFIG="pkg-config --static" \
            --with-cuda="$CUDA_PATH_MSYS"

      - name: Build
        shell: msys2 {0}
        run: make -j4

      - name: Verify binary
        shell: msys2 {0}
        run: file ./gbxminer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-windows-x86_64
          path: ./gbxminer.exe
          retention-days: 3

  # ── Lint (runs in parallel with builds) ───────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    env:
      PYTHON_VERSION: "3.11"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck codespell
          cd test
          pip install -r requirements.txt

      - name: Run lint tests
        run: |
          cd test/lint
          python3 all-lint.py

  # ── Test jobs (downstream of build jobs) ──────────────────────────────────

  test-linux-x86_64:
    needs: build-linux-x86_64
    if: always() && needs.build-linux-x86_64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-x86_64
      platform: linux-x86_64
      runner: ubuntu-24.04

  test-linux-aarch64:
    needs: build-linux-aarch64
    if: always() && needs.build-linux-aarch64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-aarch64
      platform: linux-aarch64
      runner: ubuntu-24.04-arm

  test-windows-x86_64:
    needs: build-windows-x86_64
    if: always() && needs.build-windows-x86_64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-windows-x86_64
      platform: windows-x86_64
      runner: windows-2025
