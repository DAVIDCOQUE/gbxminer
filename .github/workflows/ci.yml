name: CI

on:
  push:
  pull_request:

concurrency:
  group: |
    ${{ github.workflow }}-${{
      (vars.ALLOW_CONCURRENCY != '' && github.sha) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.number) ||
      (github.event_name == 'push' && github.ref)
    }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CUDA_VERSION: "12.8"
  CUDA_PKG_VERSION: "12-8"
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA (x86_64 network repo)
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y "cuda-toolkit-${{ env.CUDA_PKG_VERSION }}"
          echo "CUDA_HOME=/usr/local/cuda-${{ env.CUDA_VERSION }}" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure build
        run: |
          # FIX #6: rm -f already suppresses ENOENT; the || true guard was redundant.
          rm -f Makefile
          ./autogen.sh
          # LDFLAGS stubs path: libcuda.so is the NVIDIA *driver* library, absent
          # on GPU-less CI runners.  The CUDA toolkit ships a linker stub at
          # lib64/stubs/libcuda.so that satisfies -lcuda at build time.  The real
          # driver library is resolved at runtime via the user's LD_LIBRARY_PATH.
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure \
              CXXFLAGS="-O3 -D_REENTRANT -falign-functions=16 -falign-jumps=16 -falign-labels=16" \
              LDFLAGS="-L${CUDA_HOME}/lib64/stubs" \
              --with-cuda="$CUDA_HOME" \
              --with-nvml=libnvidia-ml.so \
              --with-nvrtc

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify binary
        run: |
          file ./gbxminer
          ./gbxminer --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-linux-x86_64
          path: ./gbxminer
          retention-days: 3

  # ── Linux aarch64 (native ARM64 runner) ───────────────────────────────────
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libcurl4-openssl-dev \
            libjansson-dev \
            pkg-config

      - name: Setup CUDA (aarch64/SBSA network repo)
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y "cuda-toolkit-${{ env.CUDA_PKG_VERSION }}"
          echo "CUDA_HOME=/usr/local/cuda-${{ env.CUDA_VERSION }}" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-${{ env.CUDA_VERSION }}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure build
        run: |
          # FIX #6: rm -f already suppresses ENOENT; the || true guard was redundant.
          rm -f Makefile
          ./autogen.sh
          # Same stubs rationale as x86_64: libcuda.so is a driver library,
          # absent on GPU-less CI runners.  Point the linker at the toolkit stub.
          CUDA_CFLAGS="-O3 -lineno -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure \
              CXXFLAGS="-O3 -march=armv8-a" \
              LDFLAGS="-L${CUDA_HOME}/lib64/stubs" \
              --with-cuda="$CUDA_HOME" \
              --with-nvml=libnvidia-ml.so \
              --with-nvrtc

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify binary
        run: |
          file ./gbxminer
          ./gbxminer --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-linux-aarch64
          path: ./gbxminer
          retention-days: 3

  # ── Windows x86_64 ────────────────────────────────────────────────────────
  build-windows-x86_64:
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup CUDA on Windows
        run: |
          $ErrorActionPreference = "Stop"
          $cudaVersion = "${{ env.CUDA_VERSION }}"
          $cudaInstaller = "cuda_${cudaVersion}.0_571.96_windows.exe"
          $cudaUrl = "https://developer.download.nvidia.com/compute/cuda/${cudaVersion}.0/local_installers/$cudaInstaller"
          Write-Host "Downloading CUDA from: $cudaUrl"
          Invoke-WebRequest -Uri $cudaUrl -OutFile $cudaInstaller

          # Run a full silent install (-s with no component list).
          # Component-filtered installs silently no-op when any component
          # name is unrecognised; the installer exits 0 and installs nothing.
          # A full silent install is unambiguous and idiomatic for CI.
          Write-Host "Installing CUDA $cudaVersion (silent, full)..."
          Start-Process -FilePath ".\$cudaInstaller" -ArgumentList @("-s") -Wait -NoNewWindow
          Remove-Item $cudaInstaller

          # Verify the install actually produced the expected tree before
          # proceeding.  The CUDA installer exits 0 even on partial failure,
          # so an explicit path check is the only reliable gate.
          $cudaReal = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$cudaVersion"
          if (-not (Test-Path $cudaReal)) {
              Write-Error "CUDA install did not produce expected directory: $cudaReal"
              exit 1
          }
          Write-Host "CUDA installed at: $cudaReal"

          # Create an NTFS directory junction at C:\cuda.
          # The default install path contains spaces ("Program Files",
          # "NVIDIA GPU Computing Toolkit") that autotools writes unquoted
          # into Makefile CFLAGS, causing GCC to word-split the path and
          # treat each token as a linker input.  A junction at C:\cuda is
          # space-free and kernel-transparent to both nvcc and MinGW GCC.
          $cudaJunction = "C:\cuda"
          New-Item -ItemType Junction -Path $cudaJunction -Target $cudaReal | Out-Null
          Write-Host "Junction created: $cudaJunction -> $cudaReal"

          "$cudaJunction/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_HOME=$cudaJunction" | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append
          "CUDA_PATH=$cudaJunction" | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append

      - name: Initialize MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # ilammy/msvc-dev-cmd runs VsDevCmd.bat and exports every MSVC
          # environment variable (INCLUDE, LIB, LIBPATH, VCToolsInstallDir,
          # WindowsSdkDir, etc.) to GITHUB_ENV, and adds the MSVC bin
          # directory (containing cl.exe) to GITHUB_PATH.
          #
          # nvcc requires the full MSVC developer environment to pass its
          # host-compiler OS probe.  The probe preprocesses a small C++ file
          # using cl.exe and parses the output for Windows OS markers.
          # Without the full MSVC environment, the probe output is malformed
          # and nvcc aborts with "Host compiler targets unsupported OS" even
          # though cl.exe itself runs successfully.
          #
          # These env vars propagate into the MSYS2 shell via path-type:
          # inherit on the msys2/setup-msys2 step, so nvcc invocations
          # spawned by make see the complete MSVC environment.
      - name: Create space-free MSVC lib junction
        run: |
          # VCToolsInstallDir (set by ilammy/msvc-dev-cmd) contains spaces
          # ("Program Files", "Microsoft Visual Studio").  Passing it directly
          # in LDFLAGS causes shell word-splitting that breaks gcc's configure
          # CC test.  Create a space-free junction at C:\msvc-libs — the same
          # pattern used for C:\cuda.
          $msvcLibs = Join-Path $env:VCToolsInstallDir "lib\x64"
          if (-not (Test-Path $msvcLibs)) {
              Write-Error "MSVC lib dir not found: $msvcLibs"
              exit 1
          }
          New-Item -ItemType Junction -Path C:\msvc-libs -Target $msvcLibs | Out-Null
          Write-Host "Junction: C:\msvc-libs -> $msvcLibs"

      - name: Setup Windows build (MSYS2/MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # path-type: inherit causes MSYS2 to convert and prepend the full
          # Windows PATH (including GITHUB_PATH additions from prior steps)
          # into the MSYS2 shell PATH.  Required so that nvcc.exe (a native
          # Windows binary invoked by make) inherits a PATH that includes the
          # MSVC directory added by the "Add MSVC cl.exe" step above.
          # Without this, msys2/setup-msys2 defaults to path-type: minimal
          # and strips all GITHUB_PATH additions.
          path-type: inherit
          # mingw-w64-x86_64-curl provides both the headers and libcurl.dll.a
          # import library natively — no cross-compilation or external download
          # required.  openssl, jansson, and zlib are likewise available in the
          # pacman repository and link cleanly against the MINGW64 toolchain.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-jansson
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            make
            pkg-config

      - name: Configure build
        shell: msys2 {0}
        run: |
          rm -f Makefile
          ./autogen.sh
          CUDA_PATH_MSYS=$(cygpath -m "$CUDA_HOME")
          echo "CUDA path: $CUDA_PATH_MSYS"
          # -ccbin cl.exe: ilammy/msvc-dev-cmd adds the MSVC bin directory to
          #   GITHUB_PATH, which propagates into the MSYS2 PATH via path-type:
          #   inherit.  A bare name is sufficient; no junction needed.
          #   nvcc on Windows only accepts MSVC as host compiler; cl.exe output
          #   passes the OS probe and accepts injected flags (-nologo, -EHsc).
          # -allow-unsupported-compiler: suppresses the MSVC version gate.
          #   windows-2025 ships VS 2022 17.13+, outside nvcc 12.8 validated
          #   range [2019, 2022].
          # -Wno-deprecated-gpu-targets: suppresses the pre-SM75 LTO warning.
          #   SM50-62 targets remain valid for binary generation with nvcc 12.8.
          # -Xcompiler /W3: MSVC warning level flag.  -Wall on cl.exe enables
          #   /Wall (all warnings), producing excessive output.
          # -Xcompiler /W3 omitted: MSYS2 converts any token starting with "/" as
          # a POSIX path, expanding /W3 to D:/a/_temp/msys64/W3 before it
          # reaches nvcc.  The default cl.exe warning level is acceptable.
          CUDA_CFLAGS="-O3 -lineno -ccbin cl.exe -allow-unsupported-compiler -Wno-deprecated-gpu-targets -D_FORCE_INLINES" \
          ./configure \
            CXXFLAGS="-O3 -Wno-builtin-macro-redefined" \
            LDFLAGS="-L${CUDA_PATH_MSYS}/lib/x64 -LC:/msvc-libs" \
            PKG_CONFIG="pkg-config --static" \
            --with-cuda="$CUDA_PATH_MSYS"

      - name: Patch Makefile for MSVC runtime libs
        shell: msys2 {0}
        run: |
          # -lvcruntime and -lmsvcprt cannot go in LDFLAGS because they
          # conflict with the MinGW CRT during configure CC tests.  Inject
          # them only into the final binary link by patching the Makefile.
          # The link command ends with -lcuda; append our libs after it.
          sed -i 's|-lcuda |-lcuda -lvcruntime -lmsvcprt |' Makefile

      - name: Build
        shell: msys2 {0}
        run: make -j4

      - name: Verify binary
        shell: msys2 {0}
        run: file ./gbxminer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gbxminer-windows-x86_64
          path: ./gbxminer.exe
          retention-days: 3

  # ── Lint (runs in parallel with builds) ───────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    env:
      PYTHON_VERSION: "3.11"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck codespell
          cd test
          pip install -r requirements.txt

      - name: Run lint tests
        run: |
          cd test/lint
          python3 all-lint.py

  # ── Test jobs (downstream of build jobs) ──────────────────────────────────

  test-linux-x86_64:
    needs: build-linux-x86_64
    if: always() && needs.build-linux-x86_64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-x86_64
      platform: linux-x86_64
      runner: ubuntu-24.04

  test-linux-aarch64:
    needs: build-linux-aarch64
    if: always() && needs.build-linux-aarch64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-linux-aarch64
      platform: linux-aarch64
      runner: ubuntu-24.04-arm

  test-windows-x86_64:
    needs: build-windows-x86_64
    if: always() && needs.build-windows-x86_64.result == 'success'
    uses: ./.github/workflows/test.yml
    with:
      artifact_name: gbxminer-windows-x86_64
      platform: windows-x86_64
      runner: windows-2025
