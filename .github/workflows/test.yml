name: Python Tests

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the artifact containing the built binary'
        required: true
        type: string
      platform:
        description: 'Platform identifier (linux-x86_64, linux-aarch64, windows-x86_64)'
        required: true
        type: string
      runner:
        description: 'Runner to use for tests'
        required: true
        type: string

env:
  DEBIAN_FRONTEND: noninteractive
  PYTHON_VERSION: "3.11"

jobs:
  # Unit tests - no binary required, always run
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd test
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd test
          pytest unit/ -v --tb=short

  # Functional tests - requires the built binary from the artifact
  functional-tests:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download built binary
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: .

      - name: Make binary executable (Linux)
        if: contains(inputs.platform, 'linux')
        run: chmod +x ./gbxminer

      - name: Verify binary
        run: |
          file ./gbxminer${{ contains(inputs.platform, 'windows') && '.exe' || '' }}
          ./gbxminer${{ contains(inputs.platform, 'windows') && '.exe' || '' }} --version || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          cd test
          pip install -r requirements.txt

      - name: Run functional tests
        run: |
          cd test
          pytest functional/ -v --tb=short
